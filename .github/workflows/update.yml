name: Check for OpenCode Updates

on:
  schedule:
    - cron: '0 * * * *'  # Hourly at minute 0 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check for updates
        id: check
        run: |
          # Run update.sh and capture output
          output=$(nix develop --command ./update.sh)

          # Parse UPDATE_NEEDED and NEW_VERSION from output
          update_needed=$(echo "$output" | grep '^UPDATE_NEEDED=' | cut -d= -f2)
          new_version=$(echo "$output" | grep '^NEW_VERSION=' | cut -d= -f2)

          echo "update_needed=$update_needed" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

          # Get current version for PR body
          current_version=$(jq -r '.version' version.json)
          echo "current_version=$current_version" >> $GITHUB_OUTPUT

      - name: Update version.json
        if: steps.check.outputs.update_needed == 'true'
        run: |
          nix develop --command ./update.sh --update

      - name: Run flake check
        if: steps.check.outputs.update_needed == 'true'
        run: |
          nix flake check

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="update-opencode-${{ steps.check.outputs.new_version }}"
          git checkout -b "$branch"
          git add version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update opencode to ${{ steps.check.outputs.new_version }}"
          git push -u origin "$branch"

          pr_url=$(gh pr create --title "chore: update opencode to ${{ steps.check.outputs.new_version }}" --body "$(cat <<'EOF'
          ## Automated OpenCode Update

          This PR updates OpenCode from version `${{ steps.check.outputs.current_version }}` to `${{ steps.check.outputs.new_version }}`.

          ### Changelog

          See the release notes: https://github.com/anomalyco/opencode/releases/tag/v${{ steps.check.outputs.new_version }}

          ### Changes

          - Updated `version` in `version.json`
          - Updated SRI hashes for all 4 platforms

          ---

          This PR was automatically generated by the update workflow.
          EOF
          )" --base main --head "$branch" --label "automated")
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT

      - name: Merge Pull Request
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.create-pr.outputs.pr_url }}"

      - name: Summary
        if: always()
        run: |
          echo "## Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.update_needed }}" == "true" ]; then
            echo "- **Current Version:** ${{ steps.check.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **New Version:** ${{ steps.check.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Pull request created for version update!" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Current Version:** ${{ steps.check.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Already up to date!" >> $GITHUB_STEP_SUMMARY
          fi
